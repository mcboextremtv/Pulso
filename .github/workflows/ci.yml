name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p pulso-core
      - run: cargo build --release -p pulso
      - uses: actions/upload-artifact@v4
        with:
          name: pulso-windows
          path: target/release/pulso.exe
